<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Clean Tangerine Cleaning Co. Logo</title>
  <desc id="desc">Minimal premium logo with a tangerine icon, sparkle marks, and Clean Tangerine Cleaning Co. wordmark.</desc>
  <defs>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A1C"/>
      <stop offset="100%" stop-color="#F35B04"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#F97316" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- <rect width="1200" height="800" fill="#faf8f3"/> -->

  <!-- Icon group -->
  <g transform="translate(145 238)" filter="url(#softShadow)">
    <!-- Leaves -->
    <path d="M126 24 C86 2 43 7 18 33 C53 47 94 49 126 24Z" fill="#1F2937"/>
    <path d="M136 35 C143 -4 173 -25 211 -24 C207 17 177 42 136 35Z" fill="#1F2937"/>
    <path d="M52 31 C86 38 108 51 126 71" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.25"/>

    <!-- Tangerine circle -->
    <circle cx="115" cy="170" r="96" fill="url(#orangeGrad)"/>
    <circle cx="115" cy="170" r="82" fill="none" stroke="#FFB15E" stroke-width="5" opacity="0.45"/>

    <!-- Citrus segment line -->
    <path d="M31 198 C84 181 143 166 205 157" fill="none" stroke="#FFD1A3" stroke-width="13" stroke-linecap="round" opacity="0.65"/>
    <path d="M70 210 L115 174 L111 255" fill="none" stroke="#FFD1A3" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
    <path d="M118 174 L158 243" fill="none" stroke="#FFD1A3" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
    <path d="M158 166 L188 229" fill="none" stroke="#FFD1A3" stroke-width="8" stroke-linecap="round" opacity="0.65"/>

    <!-- Shine -->
    <path d="M54 130 C61 91 84 68 124 60" fill="none" stroke="#FFE0BF" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Sparkles -->
  <g fill="#F97316">
    <path d="M390 250 L401 282 L433 293 L401 304 L390 336 L379 304 L347 293 L379 282Z"/>
    <path d="M335 285 L343 307 L365 315 L343 323 L335 345 L327 323 L305 315 L327 307Z" opacity="0.85"/>
    <path d="M295 340 L302 359 L321 366 L302 373 L295 392 L288 373 L269 366 L288 359Z" opacity="0.75"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(455 287)">
    <text x="0" y="0" font-family="Inter, Avenir Next, Montserrat, Arial, sans-serif" font-size="92" font-weight="800" fill="#1F2937" letter-spacing="-3">Clean</text>
    <text x="0" y="100" font-family="Inter, Avenir Next, Montserrat, Arial, sans-serif" font-size="92" font-weight="800" fill="#1F2937" letter-spacing="-3">Tangerine</text>
    <text x="4" y="174" font-family="Inter, Avenir Next, Montserrat, Arial, sans-serif" font-size="38" font-weight="800" fill="#F97316" letter-spacing="9">CLEANING CO.</text>
  </g>
</svg>
